name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest run per ref matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24, matching the Dockerfile and the other three repositories.
          node-version: '24'
          # No caching. The suite is a couple of seconds; a cached node_modules
          # tree is a stale-artifact source, and this project's whole subject is
          # which Playwright got installed.
          package-manager-cache: false

      # `npm ci`, not `npm install`: it installs exactly the lockfile and fails
      # if package.json and package-lock.json disagree.
      #
      # This is also the step that proves the point of the overrides block. If a
      # future dependency change reintroduces a second Playwright, the tree built
      # here is wrong and test/wiring.test.js fails - before a release, rather
      # than on someone's machine after one.
      - name: Install dependencies
        run: npm ci

      - run: npm run lint

      - run: npm test
        env:
          # The step packages are real dependencies here, not stubs, so the suite
          # asserts the installed tree is the shape this project promises. It
          # needs no browser: nothing in it navigates to OneNote.
          CI: 'true'

      # Guards against a broken bin entry, and against a package that can no
      # longer be imported - the failure that would break every consumer.
      - name: Smoke test the CLI
        run: |
          node src/index.js --version
          node src/index.js --help
          # Unattended use with no way to choose a notebook must fail before it
          # reaches the interactive picker.
          if node src/index.js export --non-interactive; then
            echo "::error::export --non-interactive without a notebook should exit non-zero"
            exit 1
          fi

      # One browser build for the whole tree. Not needed by the tests, which stub
      # the packages, but it is what CI is here to protect: if the overrides ever
      # stop collapsing Playwright, `npx playwright install` installs for one
      # revision and the second copy would need another.
      - name: Verify the tree agrees on one Chromium
        run: |
          npx playwright install --with-deps chromium
          node -e "
            const fs = require('fs');
            const seen = new Set();
            const walk = (dir, depth) => {
              if (depth > 4) return;
              let entries;
              try { entries = fs.readdirSync(dir + '/node_modules', { withFileTypes: true }); }
              catch { return; }
              for (const e of entries) {
                if (!e.isDirectory() && !e.isSymbolicLink()) continue;
                if (e.name === 'playwright' || e.name === 'playwright-core') seen.add(e.name);
                else if (!e.name.startsWith('@')) walk(dir + '/node_modules/' + e.name, depth + 1);
              }
            };
            walk(process.cwd(), 0);
            console.log('playwright copies:', [...seen].join(', ') || 'none');
            if (seen.size === 0) { console.error('no playwright found'); process.exit(1); }
          "

  # The cheap second layer under Dependabot.
  #
  # Dependabot opens a PR when a step package is published; this reports the same
  # drift on every build, including ones nobody opened a PR for. It is deliberately
  # non-blocking for the @msout/* steps - a green main that says "list-notebooks
  # 0.0.7 exists and you are on 0.0.6" is more useful than a red one, because
  # red means the last commit is broken over a dependency bump rather than over
  # anything wrong with the code. The pins are exact on purpose, so they never move
  # by themselves, and this is what makes a forgotten bump visible.
  #
  # Anything that would actually break a release is fatal instead: playwright
  # moving under the overrides, or the tree no longer collapsing to one copy.
  stale-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Report newer step packages without failing the build
        run: |
          set +e
          npm outdated --json > /tmp/outdated.json 2>/dev/null
          set -e

          node -e "
            const fs = require('fs');
            const STEPS = [
              '@msout/microsoft-webauth',
              '@msout/microsoft-onenote-list-notebooks',
              '@msout/microsoft-onenote-export-notebook',
            ];
            const pkg = require('./package.json');
            const outdated = fs.existsSync('/tmp/outdated.json')
              ? JSON.parse(fs.readFileSync('/tmp/outdated.json', 'utf8') || '{}')
              : {};

            let lines = [];
            for (const name of STEPS) {
              const pinned = pkg.dependencies[name];
              const found = outdated[name];
              if (!found) continue;
              lines.push('  ' + name);
              lines.push('      pinned ' + pinned + ', published ' + found.latest);
            }

            if (!lines.length) {
              console.log('All three step packages are at their pinned versions.');
            } else {
              console.log('A newer step package has been published (not an error -');
              console.log('Dependabot opens a PR for this, and a human decides):');
              console.log(lines.join('\n'));
              console.log('');
              console.log('To take one:');
              console.log('  npm pkg set dependencies.' + STEPS[0] + '=<version>');
              console.log('  npm install && npm test');
              console.log('then bump this package, tag, and push.');
            }
          "

      # Fatal, because these two change what a release would contain rather than
      # how current it is.
      - name: Fail if playwright drifts from the pinned override
        run: |
          OVERRIDE="$(node -p "require('./package.json').overrides.playwright")"
          INSTALLED="$(node -p "require('./node_modules/playwright/package.json').version")"
          if [ "$INSTALLED" != "$OVERRIDE" ]; then
            echo "::error::playwright installed as $INSTALLED but the overrides block pins $OVERRIDE"
            echo "::error::A release built on this tree would not have the Chromium it was tested against."
            exit 1
          fi
          echo "playwright $INSTALLED matches the override."

      # The exact pins are the design, not an oversight: a caret here is what
      # produced four Chromium revisions and a 3.2 GB browser cache. Asserted so
      # that a well-meaning "let Dependabot use ranges" cannot quietly reintroduce it.
      - name: Verify the step packages are still pinned exactly
        run: |
          node -e "
            const pkg = require('./package.json');
            const STEPS = [
              '@msout/microsoft-webauth',
              '@msout/microsoft-onenote-list-notebooks',
              '@msout/microsoft-onenote-export-notebook',
            ];
            const loose = STEPS.filter(n => /[\^~*]|x/.test(pkg.dependencies[n] || ''));
            if (loose.length) {
              console.error('::error::these step dependencies are no longer pinned exactly:', loose);
              process.exit(1);
            }
            console.log('All three step packages are pinned exactly:', STEPS.map(n => pkg.dependencies[n]).join(', '));
          "
